<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Second Highest Finder</title>
</head>
<body>
    <script>
        /**
         * Finds the second highest number in an array.
         * Handles duplicates and negative numbers.
         */
        function secondHighest(arr) let highest = -Infinity;
    let secondHighestValue = -Infinity;

    for (let i = 0; i < arr.length; i++) {
        let current = Number(arr[i]);

        if (current > highest) {
            secondHighestValue = highest;
            highest = current;
        } else if (current < highest && current > secondHighestValue) {
            secondHighestValue = current;
        }
    }

    return secondHighestValue;}

        function Main() {
            let n = parseInt(prompt("Enter the number of elements"), 10);

            // Validate number of elements
            if (isNaN(n) || n <= 0) {
                alert("Invalid number of elements.");
                return;
            }

            let arr = [];
            for (let i = 0; i < n; i++) {
                let value = parseFloat(prompt(`Enter element ${i + 1}`));
                if (isNaN(value)) {
                    alert("Invalid input. Please enter numbers only.");
                    return;
                }
                arr.push(value);
            }

            alert("Second highest value: " + secondHighest(arr));
        }

        // Run the program
        Main();
    </script>
</body>
</html>
