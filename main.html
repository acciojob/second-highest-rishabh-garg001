<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Second Highest Finder</title>
</head>
<body>
    <script>
        /**
         * Finds the second highest number in an array.
         * Handles duplicates and negative numbers.
         */
        function secondHighest(arr) {
            // Remove duplicates
            let uniqueArr = [...new Set(arr)];

            // If less than 2 unique numbers, no second highest exists
            if (uniqueArr.length < 2) {
                return "No second highest value found.";
            }

            // Sort in descending order
            uniqueArr.sort((a, b) => b - a);

            // Second element is the second highest
            return uniqueArr[1];
        }

        function Main() {
            let n = parseInt(prompt("Enter the number of elements"), 10);

            // Validate number of elements
            if (isNaN(n) || n <= 0) {
                alert("Invalid number of elements.");
                return;
            }

            let arr = [];
            for (let i = 0; i < n; i++) {
                let value = parseFloat(prompt(`Enter element ${i + 1}`));
                if (isNaN(value)) {
                    alert("Invalid input. Please enter numbers only.");
                    return;
                }
                arr.push(value);
            }

            alert("Second highest value: " + secondHighest(arr));
        }

        // Run the program
        Main();
    </script>
</body>
</html>
